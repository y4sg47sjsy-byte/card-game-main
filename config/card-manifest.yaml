  - id: xs-symbol-mic-001
    title: MIC
    type: X-STARS SYMBOL
    rarity: R
    cost: ""
    rules_text: "Stage Combo 資源：MIC。"
    ability_type: stage_symbol
    target_symbol: MIC
    set: X-STARS DEBUT STAGE
    card_no: XS01-006
    art_brief: >-
      原創 MIC Symbol：精品手持麥克風，以玫瑰金金屬、深紫握柄與星光鑲邊構成，置於圓形舞台燈框中央。背景使用洋紅紫放射光、柔焦燈泡與亮片粒子，呈現高品質休閒 slot symbol 的飽滿體積、強烈高光與即時辨識度，同時保持偶像舞台而非寫實賭場語彙。
    identity_constraints: &symbol_identity
      - Symbol 必須是畫面唯一主體且第一眼可辨識
      - 使用原創造型，不引用真實品牌、產品或 X-STARS 角色 identity
      - 與同系列共用精品 3D、舞台燈框、飽和色彩與強高光語言
    composition: &symbol_composition
      - illustration 專為 template 的 654×560（約 7:6）橫向視窗構圖
      - 單一大型 Symbol 置中，占畫面約 55–65%
      - 完整輪廓置於 center-crop-safe region，縮圖尺寸仍可辨識
      - 背景簡潔、明亮且對比清楚
    forbidden_elements: &symbol_forbidden
      - 卡框、文字、字母、數字、UI、logo、品牌或 watermark
      - 人物、手、角色剪影或 X-STARS 成員特徵
      - 多個競爭主體、低對比或過暗背景
      - 賭桌、撲克牌、籌碼、輪盤或寫實博彩場景
    references: []

