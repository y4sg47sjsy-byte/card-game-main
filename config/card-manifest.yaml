  - id: aurora-neon-pulse-sr
    title: AURORA · NEON PULSE
    type: X-STARS CHARACTER · SR
    rarity: SR
    cost: "3"
    rules_text: "登場時，取得 1 個 MIC Symbol。"
    character_id: AURORA
    ability_type: gain_symbol
    target_symbol: MIC
    set: X-STARS DEBUT STAGE
    card_no: XS01-001
    art_brief: >-
      完整保留 final-approved reference 中 AURORA 的原設定服裝、配件、配色與 identity，不換裝也不新增配件。AURORA 在 Neon Pulse 舞台上向前踏步並抬手掌握節拍，帶著沉浸演出、略帶興奮的自信表情；背景為洋紅與青藍 LED 光牆、柔化觀眾光點與節奏光束。使用洋紅主光、青藍輪廓光及清晰臉部補光，呈現 SR 的明亮舞台能量與收藏感。
    identity_constraints:
      - 角色 identity 僅以 AURORA 的 primary reference 為準
      - 完整保留 reference 中的臉部、五官、髮型、髮色、體型、膚色與辨識特徵
      - 完整保留原設定服裝與配件，不得換裝或新增配件
      - 不得混入其他 X-STARS 成員的 identity 特徵
    composition:
      - illustration 專為 template 的 654×560（約 7:6）橫向視窗構圖
      - 單一角色占畫面約 60–65%，採中景至近全身的動態英雄式構圖
      - 完整頭部、髮型、雙手與服裝辨識輪廓置於 center-crop-safe region
      - 背景建立舞台主題但不得搶過角色
    forbidden_elements: &character_forbidden
      - 卡框、文字、數字、UI、logo、團名或 watermark
      - 改變 reference 定義的角色 identity、年齡感或身體比例
      - 其他成員、重複角色、替身或 crowd 中的清晰人物
      - 武器、戰鬥、傷害、過暗或恐怖氛圍
      - 賭桌、撲克牌、籌碼、輪盤或寫實博彩場景
    references:
      - assets/references/x-stars/final-approved/AURORA.png

