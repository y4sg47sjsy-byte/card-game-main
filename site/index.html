<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>卡牌介紹｜X-STARS</title>
    <meta
      name="description"
      content="X-STARS 卡牌介紹，提供 40 張角色卡的搜尋、篩選與卡面檢視功能。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand-lockup" href="index.html" aria-label="X-STARS 首頁">
        <img src="assets/logo/stars-logo-transparent.png" alt="X-STARS" />
        <span>Card Archive</span>
      </a>
      <nav class="top-nav" aria-label="主要導覽">
        <a class="is-active" href="index.html" aria-current="page">卡牌介紹</a>
        <a href="business.html">商業價值</a>
        <a href="process.html">設計流程</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <img
        class="hero-image"
        src="assets/generated/x-stars/x-stars-stage-chorus-group-v1.png"
        alt="X-STARS 團體舞台演出主視覺"
      />
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <p class="eyebrow">X-STARS DEBUT STAGE</p>
        <h1 id="hero-title">SHINE TOGETHER, BECOME THE STARS</h1>
        <p>搜尋、篩選並查看 40 張 X-STARS 角色卡的完整卡面與能力資料。</p>
        <a class="hero-link" href="#cards">查看卡牌</a>
      </div>
    </section>

    <main>
      <section class="archive-shell" id="cards" aria-labelledby="cards-title">
        <div class="archive-toolbar">
          <div>
            <p class="section-kicker">Card Database</p>
            <h2 id="cards-title">卡牌資料庫</h2>
          </div>
          <label class="search-field">
            <span>搜尋</span>
            <input id="searchInput" type="search" placeholder="卡號、卡名、角色、技能" autocomplete="off" />
          </label>
        </div>

        <div class="filters" aria-label="卡牌篩選">
          <label>
            系列
            <select id="seriesFilter"></select>
          </label>
          <label>
            類型
            <select id="typeFilter"></select>
          </label>
          <label>
            稀有度
            <select id="rarityFilter"></select>
          </label>
          <button class="ghost-button" id="clearFilters" type="button">清除篩選</button>
        </div>

        <div class="archive-meta">
          <span id="resultCount"></span>
          <span>40 張卡牌資料與正式卡面均已同步。</span>
        </div>

        <div class="card-grid" id="cardGrid"></div>
      </section>

    </main>

    <dialog class="detail-dialog" id="detailDialog">
      <button class="close-button" id="closeDetail" type="button" aria-label="關閉">×</button>
      <div id="detailContent"></div>
    </dialog>

    <footer>
      <span>X-STARS</span>
      <span>SHINE TOGETHER, BECOME THE STARS</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
