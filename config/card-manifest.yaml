  - id: xs-symbol-wild-001
    title: WILD
    type: X-STARS SYMBOL · SPECIAL
    rarity: SR
    cost: ""
    rules_text: "可作為任意 1 種 Symbol，用於完成 Stage Combo。"
    ability_type: wild_symbol
    target_symbol: ANY
    set: X-STARS DEBUT STAGE
    card_no: XS01-010
    art_brief: >-
      原創 WILD Symbol：由 MIC、NOTE、GEM、STAR 四種抽象輪廓光融合成虹彩五芒星核心，外圍以五色極光帶、白金環與舞台燈泡構成。背景使用明亮宇宙紫、虹彩爆發光與受控亮片粒子，呈現全系列最高辨識度、驚喜感與稀有爽感，但不生成文字 WILD。
    identity_constraints:
      - WILD 必須是唯一主體，視覺價值明顯高於四種基本 Symbol
      - 使用原創融合徽章，不引用真實品牌或 X-STARS 角色 identity
      - 延續系列精品 3D 舞台語言，以完整虹彩光譜表達萬用性
    composition:
      - illustration 專為 template 的 654×560（約 7:6）橫向視窗構圖
      - 單一融合 Symbol 置中，占畫面約 60–70%
      - 虹彩核心與白金外環完整置於 center-crop-safe region
      - 四種基礎 Symbol 只以次要抽象輪廓暗示
    forbidden_elements:
      - 卡框、任何可讀文字、字母、數字、UI、logo、品牌或 watermark
      - 人物、手、角色剪影或 X-STARS 成員特徵
      - 四張獨立 Symbol 卡、雜亂拼貼、低對比或過暗背景
      - 賭桌、撲克牌、籌碼、輪盤或寫實博彩場景
    references: []
